services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - yarn_cache:/usr/local/share/.cache/yarn
    command: sh -c 'yarn install --frozen-lockfile --network-timeout 600000 && yarn --cwd excalidraw-app vite --host 0.0.0.0 --port 3000'
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: "${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-}"
      VITE_APP_ENABLE_ESLINT: "false"
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok || !(r.headers.get('content-type') || '').includes('text/html')) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5
volumes:
  node_modules:
  yarn_cache:
